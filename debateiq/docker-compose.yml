version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: debateiq_postgres
    restart: always
    environment:
      POSTGRES_USER: debateiq
      POSTGRES_PASSWORD: debateiq_secure_password
      POSTGRES_DB: debateiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debateiq -d debateiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: debateiq_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - USE_SQLITE=false
      - DATABASE_URL=postgresql://debateiq:debateiq_secure_password@db:5432/debateiq_db
      - JWT_SECRET_KEY=debateiq-super-secure-production-jwt-token-key-2026
      - LLM_PROVIDER=mock
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: debateiq_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
