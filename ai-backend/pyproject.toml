[project]
name = "debate-ai-backend"
version = "0.1.0"
description = "Python inference service for the debate coaching demo"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=1.2.14",
    "PyJWT[crypto]>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.18,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
ser = ["speechbrain>=1.0,<2.0"]
laya = [
    "laya>=0.4.14,<0.5",
    "torch>=2.14",
]

[dependency-groups]
dev = ["pytest>=8.0,<10.0", "ruff>=0.6,<1.0"]
stt = ["faster-whisper>=1.2,<2.0", "av>=12,<14"]
# Voice mode playback. Kokoro-82M weights are Apache-2.0; see docs/VOICE.md.
tts = ["kokoro-onnx>=0.4.9,<0.5", "onnxruntime>=1.20,<2.0", "soundfile>=0.12,<1.0"]

[tool.uv]
default-groups = ["dev", "stt"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
