# Configure Supabase in the root .env before starting; REQUIRE_AUTH=true is the default.
# Start with docker compose up --build, then open http://localhost:8080.
# REQUIRE_AUTH=false permits local API requests without a token but does not unlock browser practice.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Pulls the model once so the API does not start against an empty model list.
  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen3.5:4b}"]
    restart: "no"

  api:
    build:
      context: ./ai-backend
      target: runtime
      # Optional extras only; local transcription is part of the default dependency groups.
      args:
        EXTRAS: ${EXTRAS:-}
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    environment:
      # Point at http://host.docker.internal:11434 to reuse a host Ollama (docker compose up api web).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      # Optional hosted provider; the API uses it when LLM_PROVIDER=openai or a key is set.
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_JSON_MODE: ${OPENAI_JSON_MODE:-json_schema}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENABLE_LAYA_TACTICS: ${ENABLE_LAYA_TACTICS:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      # "public" refuses to start without REQUIRE_AUTH=true and explicit https origins.
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      MODEL_RATE_LIMIT_PER_MINUTE: ${MODEL_RATE_LIMIT_PER_MINUTE:-12}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
      # Transcription ships with the image; these only tune the speech model.
      STT_MODEL: ${STT_MODEL:-distil-large-v3.5}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-}
      STT_LANGUAGE: ${STT_LANGUAGE:-en}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-5}
      STT_VAD: ${STT_VAD:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Keeps downloaded Hugging Face models across image rebuilds.
      - hf-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health").read()
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./web
      args:
        # Same-origin: nginx proxies /api to the api service.
        VITE_API_BASE_URL: ""
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  ollama-models:
  hf-cache:
