version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: justitalk-postgres
    restart: always
    environment:
      POSTGRES_USER: justitalk_user
      POSTGRES_PASSWORD: justitalk_password
      POSTGRES_DB: justitalk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justitalk_user -d justitalk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: justitalk-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://justitalk_user:justitalk_password@db:5432/justitalk_db
      SECRET_KEY: justitalk-super-secret-jwt-key-for-debate-coach-ai-2026
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: justitalk-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
