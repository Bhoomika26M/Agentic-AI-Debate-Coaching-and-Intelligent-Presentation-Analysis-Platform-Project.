services:
  postgres:
    image: postgres:16
    container_name: debate-coach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: debate_coach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
