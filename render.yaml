# Static frontend only. The Python API + Ollama stay local/VPS for now; add a
# backend service here only with hosted BYOK + REQUIRE_AUTH=true verified.
# TODO: narrow connect-src from 'self https:' to the exact API + Supabase origins.
services:
  - type: web
    runtime: static
    name: verdict-frontend
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
